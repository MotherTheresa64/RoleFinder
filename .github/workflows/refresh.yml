name: Refresh job snapshot

on:
  schedule:
    # 06:17 UTC daily, off the hour so it does not pile onto everyone else's cron
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check
        run: npm run check

      - name: Ingest postings
        run: npm run ingest

      - name: Rebuild static output
        run: npm run build

      - name: Commit the refreshed snapshot
        run: |
          if git diff --quiet -- snapshot/jobs.json; then
            echo "snapshot unchanged, nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/jobs.json
          git commit -m "Refresh job snapshot"
          git push
